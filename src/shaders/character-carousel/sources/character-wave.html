<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>思想银河 · 银河的故事</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      background: #121212;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #121212;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      --pointer-y: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          circle at var(--pointer-x) var(--pointer-y),
          rgba(255, 255, 255, 0.028),
          transparent 24rem
        ),
        #141414;
      perspective: 1100px;
      touch-action: none;
      cursor: crosshair;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 34%,
        rgba(0, 0, 0, 0.13) 70%,
        rgba(0, 0, 0, 0.36) 120%
      );
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
      transform: rotate(7deg);
      mix-blend-mode: soft-light;
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(122px, 10.45vw, 164px);
      aspect-ratio: 0.69;
      padding: clamp(8px, 0.78vw, 12px);
      border: 0;
      border-radius: clamp(10px, 1.05vw, 16px);
      color: #f3f0e9;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.045), transparent 34%),
        var(--card-color);
      box-shadow:
        0 calc(7px + var(--focus) * 20px) calc(13px + var(--focus) * 40px)
          rgba(0, 0, 0, calc(0.25 + var(--focus) * 0.34)),
        inset 0 1px rgba(255, 255, 255, 0.06),
        inset 0 0 0 1px rgba(0, 0, 0, 0.24);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, calc(0.035 + var(--focus) * 0.12));
      border-radius: inherit;
      pointer-events: none;
    }

    .card:focus-visible::after {
      border-color: rgba(255, 255, 255, 0.72);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
    }

    .portrait {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: clamp(7px, 0.75vw, 11px);
      background: rgba(8, 9, 9, 0.24);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.04),
        inset 0 -16px 28px rgba(0, 0, 0, 0.13);
      transform: translateZ(7px);
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.88) contrast(1.02);
    }

    .identity {
      display: grid;
      place-items: center;
      gap: clamp(2px, 0.25vw, 4px);
      margin-top: clamp(7px, 0.72vw, 11px);
      text-align: center;
      transform: translateZ(8px);
    }

    .name {
      max-width: 100%;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.93);
      font-size: clamp(8px, 0.72vw, 11px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.035em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .role {
      max-width: 100%;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.48);
      font-size: clamp(4px, 0.37vw, 6px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .follow {
      margin-top: clamp(3px, 0.35vw, 6px);
      padding: clamp(3px, 0.28vw, 4px) clamp(9px, 0.85vw, 13px);
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(0, 0, 0, 0.86);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.42);
      font-size: clamp(3px, 0.29vw, 5px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card[aria-current="true"] .follow {
      color: #fff;
      background: #050505;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 680px) {
      .stage {
        min-height: 520px;
      }

      .card {
        width: clamp(112px, 31vw, 138px);
      }
    }


    .hud,
    .questions {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      color: #f3f0e9;
    }

    .hud {
      top: clamp(18px, 3.2vh, 36px);
      left: clamp(18px, 2.4vw, 36px);
      max-width: min(28rem, 42vw);
    }

    .hud-heading {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-mark {
      flex: none;
      width: clamp(30px, 2.8vw, 38px);
      height: clamp(30px, 2.8vw, 38px);
    }

    .hud .kicker {
      margin: 0;
      font-size: clamp(9px, 0.72vw, 11px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(243, 240, 233, 0.48);
    }

    .hud .title {
      margin: 5px 0 0;
      font-family: "Songti SC", "Noto Serif SC", "Iowan Old Style", Georgia, serif;
      font-size: clamp(22px, 2.35vw, 34px);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }

    .hud .lede {
      margin: 10px 0 0;
      max-width: 28em;
      font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      font-size: clamp(11px, 0.92vw, 13px);
      line-height: 1.55;
      color: rgba(243, 240, 233, 0.58);
    }

    .hud-actions {
      margin: 16px 0 0;
    }

    .orient-btn {
      pointer-events: auto;
      min-height: 36px;
      padding: 0 16px;
      border: 1px solid rgba(243, 240, 233, 0.14);
      border-radius: 999px;
      color: rgba(243, 240, 233, 0.82);
      background: transparent;
      font: 600 12px/1 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .questions {
      right: clamp(18px, 2.4vw, 36px);
      bottom: clamp(18px, 3.2vh, 36px);
      display: grid;
      gap: 7px;
      max-width: min(22rem, 38vw);
      text-align: right;
    }

    .questions .q {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      font-size: clamp(10px, 0.82vw, 12px);
      line-height: 1.4;
      color: rgba(243, 240, 233, 0.42);
    }

    .name,
    .role {
      font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      letter-spacing: 0.04em;
    }

    @media (max-width: 680px) {
      .hud {
        max-width: min(92vw, 24rem);
      }

      .questions {
        display: none;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }

    .stage {
      min-height: 0;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="思想银河故事与观点人格卡">
    <h1 class="sr-only">银河的故事 · 观点人格卡</h1>
    <p class="sr-only">
      移动指针或用方向键浏览人格卡。空格键切换横向 / 纵向波浪。
    </p>
    <div class="deck" id="deck" data-testid="deck"></div>
    <aside class="hud">
      <div class="hud-heading">
        <svg class="hud-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10.5 35.3C8.9 22.5 18.5 11.5 31.8 10.7c8.7-.5 16.6 3.4 21.1 9.7" fill="none" stroke="#f5f5f5" stroke-width="2.8" stroke-linecap="round" />
          <path d="M54.6 27.3c2.3 12.2-6.2 23.6-19.1 25.7-9 1.5-17.8-2.1-22.7-8.8" fill="none" stroke="#1772f6" stroke-width="2.8" stroke-linecap="round" />
          <circle cx="12.2" cy="35.5" r="4.7" fill="#0b0b0b" stroke="#f5f5f5" stroke-width="2.2" />
          <circle cx="53.1" cy="22.5" r="4.7" fill="#0b0b0b" stroke="#1772f6" stroke-width="2.2" />
          <circle cx="46.8" cy="46.4" r="2.4" fill="#1772f6" />
          <path d="M32 21.1c1.1 5.9 4 8.8 9.9 9.9-5.9 1.1-8.8 4-9.9 9.9-1.1-5.9-4-8.8-9.9-9.9 5.9-1.1 8.8-4 9.9-9.9Z" fill="#f5f5f5" stroke="#0b0b0b" stroke-width="1.3" stroke-linejoin="round" />
          <circle cx="32" cy="31" r="2.3" fill="#1772f6" />
        </svg>
        <div>
          <p class="kicker">Soular · Galaxy Stories</p>
          <p class="title">银河的故事</p>
        </div>
      </div>
      <p class="lede">每个回答都是一颗星。进入观点星云，在真实讨论中留下你的选择，看看你的观点会落在哪片星域。</p>
      <p class="hud-actions"><button type="button" class="orient-btn" id="orient-btn">竖过来</button></p>
    </aside>
    <aside class="questions" aria-hidden="true">
      <p class="q">从一条问题出发，穿过不同立场</p>
      <p class="q">点赞形成你的星位，抽取观点人格</p>
    </aside>
  </main>

      };

      const profiles = [
        {
          name: "长答派",
          role: "万字长答",
          color: "#414552",
          portrait: "fox"
        },
        {
          name: "拆题派",
          role: "先重述问题",
          color: "#1e2b2d",
          portrait: "bear"
        },
        {
          name: "盐选派",
          role: "精选长文",
          color: "#624936",
          portrait: "cat"
        },
        {
          name: "深夜派",
          role: "三点的诚实",
          color: "#5b5d37",
          portrait: "owl"
        },
        {
          name: "提问派",
          role: "把问题问清楚",
          color: "#4a3548",
          portrait: "rabbit"
        },
        {
          name: "收藏派",
          role: "先存再看",
          color: "#1c2838",
          portrait: "penguin"
        },
        {
          name: "圆桌派",
          role: "把人拉齐",
          color: "#5c3220",
          portrait: "redpanda"
        },
        {
          name: "杠精派",
          role: "先找反例",
          color: "#3a4030",
          portrait: "goat"
        },
        {
          name: "想法派",
          role: "三百字闪过",
          color: "#2a4530",
          portrait: "frog"
        }
      ];

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Focus ${profile.name}, ${profile.role}`);
        card.style.setProperty("--card-color", profile.color);
        card.innerHTML = `
          <span class="portrait">
            <img src="${portraits[profile.portrait]}" alt="${profile.name} 的知识人格卡">
          </span>
          <span class="identity">
            <span class="name">${profile.name}</span>
            <span class="role">${profile.role}</span>
            <span class="follow" aria-hidden="true">Reveal</span>
          </span>`;
        deck.append(card);
        return card;
      });

      const state = {
        phase: 2,
        targetPhase: 2,
        basePhase: 2,
        orientation: window.innerWidth < 680 ? 1 : 0,
        targetOrientation: window.innerWidth < 680 ? 1 : 0,
        pointerX: 0,
        pointerY: 0,
        tiltX: 0,
        tiltY: 0,
        active: false,
        manualOrientation: false,
        lastInput: performance.now()
      };

      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const count = cards.length;

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function select(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.basePhase += delta;
        state.targetPhase = state.basePhase;
        state.lastInput = performance.now();
      }

      function setPointer(event) {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));

        state.pointerX = nx;
        state.pointerY = ny;
        state.tiltX = nx;
        state.tiltY = ny;
        state.active = true;
        state.lastInput = performance.now();

        const axis = state.targetOrientation > 0.5 ? ny : nx;
        state.targetPhase = state.basePhase + axis * (window.innerWidth < 680 ? 1.55 : 2.45);
        stage.style.setProperty("--pointer-x", `${((nx + 1) / 2) * 100}%`);
        stage.style.setProperty("--pointer-y", `${((ny + 1) / 2) * 100}%`);
      }

      function toggleOrientation() {
        state.manualOrientation = true;
        state.targetOrientation = state.targetOrientation > 0.5 ? 0 : 1;
        state.targetPhase = state.basePhase;
        state.lastInput = performance.now();
        parent.postMessage({ type: "wave-orient", vertical: state.targetOrientation > 0.5 }, "*");
        syncOrientBtn();
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "wave-orient-toggle") toggleOrientation();
      });
      const orientBtn = document.querySelector("#orient-btn");
      function syncOrientBtn() {
        if (!orientBtn) return;
        orientBtn.textContent = state.targetOrientation > 0.5 ? "横过来" : "竖过来";
      }
      orientBtn?.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        toggleOrientation();
        syncOrientBtn();
      });


      cards.forEach((card, index) => {
        card.dataset.cast = profiles[index].portrait;
        card.addEventListener("click", () => {
          select(index);
          parent.postMessage({ type: "wave-open", cast: profiles[index].portrait }, "*");
        });
        card.addEventListener("focus", () => select(index));
      });

      stage.addEventListener("pointermove", setPointer);
      stage.addEventListener("pointerdown", setPointer);
      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.targetPhase = state.basePhase;
        state.pointerX = 0;
        state.pointerY = 0;
        stage.style.setProperty("--pointer-x", "50%");
        stage.style.setProperty("--pointer-y", "50%");
      });

      stage.addEventListener("dblclick", toggleOrientation);

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.basePhase += direction;
        state.targetPhase = state.basePhase;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      window.addEventListener("keydown", (event) => {
        if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp", " "].includes(event.key)) {
          event.preventDefault();
        }
        if (event.key === "ArrowRight" || event.key === "ArrowDown") {
          state.basePhase += 1;
          state.targetPhase = state.basePhase;
          state.lastInput = performance.now();
        }
        if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
          state.basePhase -= 1;
          state.targetPhase = state.basePhase;
          state.lastInput = performance.now();
        }
        if (event.key === " ") toggleOrientation();
      });

      window.addEventListener("resize", () => {
        if (!state.manualOrientation) {
          state.targetOrientation = window.innerWidth < 680 ? 1 : 0;
        }
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.0007, deltaTime / 1000);

        if (!state.active && !state.manualOrientation && time - state.lastInput > 4200) {
          const idle = time - state.lastInput - 4200;
          state.targetPhase = state.basePhase + Math.sin(idle * 0.00034) * 1.9;
          state.targetOrientation = (Math.sin(idle * 0.00019 - Math.PI / 2) + 1) / 2;
        }

        state.phase += (state.targetPhase - state.phase) * ease;
        state.orientation += (state.targetOrientation - state.orientation) * ease * 0.72;
        state.tiltX += ((state.active ? state.pointerX : 0) - state.tiltX) * ease * 0.72;
        state.tiltY += ((state.active ? state.pointerY : 0) - state.tiltY) * ease * 0.72;

        const horizontalSpacing = Math.min(150, Math.max(102, window.innerWidth * 0.096));
        const verticalSpacing = Math.min(136, Math.max(99, window.innerHeight * 0.148));
        const activeIndex = nearestIndex();

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-Math.pow(distance, 2) * 1.05);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);

          const horizontalX = delta * horizontalSpacing;
          const horizontalY = -Math.pow(distance, 1.45) * 6 + Math.sin(delta * 0.8) * 5;
          const verticalX = Math.sin(delta * 0.82) * Math.min(78, window.innerWidth * 0.06)
            + direction * Math.pow(distance, 1.25) * 8;
          const verticalY = delta * verticalSpacing;

          const x = horizontalX * (1 - state.orientation) + verticalX * state.orientation;
          const y = horizontalY * (1 - state.orientation) + verticalY * state.orientation;
          const z = focus * 95 - distance * 78;
          const scale = 0.57 + side * 0.16 + focus * 0.38;
          const rotateX = (
            -state.tiltY * focus * 5
            + delta * 2.2 * state.orientation
          );
          const rotateY = (
            state.tiltX * focus * 7
            - delta * 8.5 * (1 - state.orientation)
          );
          const rotateZ = (
            delta * 2.25 * (1 - state.orientation)
            - delta * 1.4 * state.orientation
          );

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.14, side * 0.82 + focus * 0.18));
          card.style.filter = `blur(${Math.max(0, distance - 1.35) * 0.45}px) saturate(${0.72 + focus * 0.28})`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
